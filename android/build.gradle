// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // Espejo de Google Maven (dl.google.com está bloqueado en esta red)
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // El espejo tambien para los buildscript de los submodulos
    // (capacitor-android declara los suyos propios con google())
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
        }
    }
    repositories {
        // Espejo de Google Maven (dl.google.com está bloqueado en esta red)
        maven { url 'https://maven.aliyun.com/repository/google' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Evita la descarga de jars de validacion (lint): solo estorban en esta red.
// Borrar esta seccion cuando haya conexion estable.
allprojects {
    tasks.configureEach { t ->
        if (t.name == 'extractDebugAnnotations' || t.name == 'extractAnnotationAnnotations') {
            t.enabled = false
        }
    }
    // El task siguiente (syncDebugLibJars) exige este archivo; vacio es valido.
    def stub = new File(buildDir, 'intermediates/annotations_typedef_file/debug/extractDebugAnnotations/typedefs.txt')
    if (!stub.parentFile.exists()) stub.parentFile.mkdirs()
    if (!stub.exists()) stub.text = ''
}
